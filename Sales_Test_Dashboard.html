<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sales Module — Test Execution Dashboard</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'DM Sans',sans-serif;background:#F4F6F9;min-height:100vh;padding:2rem}
  .page{max-width:1100px;margin:0 auto}
  .header{display:flex;align-items:center;justify-content:space-between;margin-bottom:2rem;background:#fff;border-radius:16px;padding:1.25rem 1.5rem;border:1px solid #E8ECF0}
  .header-left{display:flex;align-items:center;gap:14px}
  .header-icon{width:44px;height:44px;border-radius:12px;background:#E6F1FB;display:flex;align-items:center;justify-content:center;color:#185FA5;font-size:22px}
  .header-title{font-size:18px;font-weight:600;color:#1A202C}
  .header-sub{font-size:13px;color:#6B7280;margin-top:2px}
  .btn-add{font-size:13px;padding:8px 18px;border-radius:20px;border:1.5px solid #3B6D11;background:#EAF3DE;color:#27500A;cursor:pointer;display:flex;align-items:center;gap:6px;font-weight:600;font-family:'DM Sans',sans-serif;transition:all 0.15s}
  .btn-add:hover{background:#C0DD97}
  .summary{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:1.5rem}
  .metric{border-radius:14px;padding:1.1rem 1.25rem;display:flex;flex-direction:column;gap:10px;border:1.5px solid transparent}
  .metric.total{background:#E6F1FB;border-color:#B5D4F4}
  .metric.pass{background:#EAF3DE;border-color:#C0DD97}
  .metric.fail{background:#FCEBEB;border-color:#F7C1C1}
  .metric.pending{background:#FAEEDA;border-color:#FAC775}
  .metric.pct{background:#EEEDFE;border-color:#CECBF6}
  .metric-top{display:flex;align-items:center;justify-content:space-between}
  .metric-label{font-size:12px;font-weight:600;letter-spacing:0.02em}
  .metric.total .metric-label{color:#0C447C}
  .metric.pass .metric-label{color:#27500A}
  .metric.fail .metric-label{color:#791F1F}
  .metric.pending .metric-label{color:#633806}
  .metric.pct .metric-label{color:#3C3489}
  .metric-icon{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px}
  .metric.total .metric-icon{background:#B5D4F4;color:#0C447C}
  .metric.pass .metric-icon{background:#C0DD97;color:#27500A}
  .metric.fail .metric-icon{background:#F7C1C1;color:#791F1F}
  .metric.pending .metric-icon{background:#FAC775;color:#633806}
  .metric.pct .metric-icon{background:#CECBF6;color:#3C3489}
  .metric-value{font-size:30px;font-weight:600}
  .metric.total .metric-value{color:#0C447C}
  .metric.pass .metric-value{color:#27500A}
  .metric.fail .metric-value{color:#791F1F}
  .metric.pending .metric-value{color:#633806}
  .metric.pct .metric-value{color:#3C3489}
  .progress-wrap{background:#fff;border-radius:14px;padding:1.1rem 1.5rem;margin-bottom:1.5rem;border:1px solid #E8ECF0}
  .progress-label{display:flex;justify-content:space-between;font-size:12px;color:#6B7280;margin-bottom:8px;font-weight:500}
  .progress-bar{height:10px;background:#F0F2F5;border-radius:6px;overflow:hidden;display:flex;gap:2px}
  .progress-pass{height:100%;background:#639922;border-radius:6px;transition:width 0.4s}
  .progress-fail{height:100%;background:#E24B4A;border-radius:6px;transition:width 0.4s}
  .progress-pending{height:100%;background:#BA7517;border-radius:6px;transition:width 0.4s}
  .legend{display:flex;gap:16px;margin-top:8px}
  .legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:#6B7280;font-weight:500}
  .legend-dot{width:8px;height:8px;border-radius:50%}
  .controls{display:flex;gap:8px;margin-bottom:1rem;flex-wrap:wrap;align-items:center}
  .filter-pill{font-size:12px;padding:6px 14px;border-radius:20px;border:1.5px solid #E8ECF0;background:#fff;color:#6B7280;cursor:pointer;display:flex;align-items:center;gap:5px;font-family:'DM Sans',sans-serif;font-weight:500;transition:all 0.15s}
  .filter-pill:hover{border-color:#B5D4F4;color:#185FA5}
  .filter-pill.active-all{background:#E6F1FB;color:#0C447C;border-color:#85B7EB}
  .filter-pill.active-pass{background:#EAF3DE;color:#27500A;border-color:#97C459}
  .filter-pill.active-fail{background:#FCEBEB;color:#791F1F;border-color:#F09595}
  .filter-pill.active-pending{background:#FAEEDA;color:#633806;border-color:#EF9F27}
  .search-wrap{flex:1;min-width:200px;position:relative}
  .search-wrap i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#9CA3AF;font-size:15px;pointer-events:none}
  .search-input{width:100%;font-size:13px;padding:8px 12px 8px 36px;border-radius:20px;border:1.5px solid #E8ECF0;background:#fff;color:#1A202C;font-family:'DM Sans',sans-serif;transition:border 0.15s}
  .search-input:focus{outline:none;border-color:#85B7EB}
  .add-form{background:#fff;border-radius:14px;border:1px solid #E8ECF0;padding:1.5rem;margin-bottom:1.5rem;display:none}
  .add-form.open{display:block}
  .add-form-title{font-size:14px;font-weight:600;color:#1A202C;margin-bottom:14px;display:flex;align-items:center;gap:8px}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
  .form-full{grid-column:1/-1}
  .form-group{display:flex;flex-direction:column;gap:5px}
  .form-group label{font-size:12px;color:#6B7280;font-weight:600}
  .form-group input,.form-group select{font-size:13px;padding:8px 12px;border-radius:10px;border:1.5px solid #E8ECF0;background:#F9FAFB;color:#1A202C;font-family:'DM Sans',sans-serif;transition:border 0.15s}
  .form-group input:focus,.form-group select:focus{outline:none;border-color:#85B7EB;background:#fff}
  .form-btns{display:flex;gap:10px}
  .btn-save{font-size:13px;padding:8px 18px;border-radius:10px;border:1.5px solid #3B6D11;background:#EAF3DE;color:#27500A;cursor:pointer;font-weight:600;font-family:'DM Sans',sans-serif;transition:all 0.15s}
  .btn-save:hover{background:#C0DD97}
  .btn-cancel{font-size:13px;padding:8px 18px;border-radius:10px;border:1.5px solid #E8ECF0;background:#fff;color:#6B7280;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all 0.15s}
  .btn-cancel:hover{background:#F0F2F5}
  .table-card{background:#fff;border:1px solid #E8ECF0;border-radius:14px;overflow:hidden}
  table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:13px}
  th{background:#F8FAFC;color:#6B7280;font-weight:600;padding:11px 16px;text-align:left;border-bottom:1px solid #E8ECF0;font-size:11px;letter-spacing:0.04em;text-transform:uppercase}
  th:nth-child(1){width:50px}th:nth-child(2){width:auto}th:nth-child(3){width:95px}th:nth-child(4){width:160px}
  td{padding:11px 16px;border-bottom:1px solid #F0F2F5;vertical-align:middle;color:#1A202C}
  tr:last-child td{border-bottom:none}
  tr.pass-row td{background:#F4FAE8}
  tr.fail-row td{background:#FEF2F2}
  tr.pending-row td{background:#FFFBF0}
  tr:hover td{filter:brightness(0.97)}
  .badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px}
  .badge.pass{background:#C0DD97;color:#27500A}
  .badge.fail{background:#F7C1C1;color:#791F1F}
  .badge.pending{background:#FAC775;color:#633806}
  .dot{width:6px;height:6px;border-radius:50%;display:inline-block}
  .dot.pass{background:#3B6D11}.dot.fail{background:#A32D2D}.dot.pending{background:#854F0B}
  .tc-name{font-size:13px;line-height:1.5;color:#1A202C}
  .tc-num{font-size:11px;color:#9CA3AF;font-weight:600;background:#F0F2F5;padding:2px 7px;border-radius:6px}
  .actions{display:flex;gap:6px;align-items:center}
  .btn-play{font-size:12px;padding:6px 12px;border-radius:20px;border:1.5px solid #85B7EB;background:#E6F1FB;color:#0C447C;cursor:pointer;display:flex;align-items:center;gap:4px;font-family:'DM Sans',sans-serif;font-weight:600;transition:all 0.15s}
  .btn-play:hover{background:#B5D4F4}
  .btn-pass{font-size:13px;padding:6px 9px;border-radius:10px;border:1.5px solid #97C459;background:#fff;color:#27500A;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all 0.15s}
  .btn-fail{font-size:13px;padding:6px 9px;border-radius:10px;border:1.5px solid #F09595;background:#fff;color:#791F1F;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all 0.15s}
  .btn-del{font-size:13px;padding:6px 9px;border-radius:10px;border:1.5px solid #E8ECF0;background:#fff;color:#9CA3AF;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all 0.15s}
  .btn-pass:hover{background:#EAF3DE}.btn-fail:hover{background:#FCEBEB}.btn-del:hover{background:#FCEBEB;color:#791F1F;border-color:#F09595}
  .empty{text-align:center;padding:3rem;color:#9CA3AF;font-size:14px}
  .count-badge{font-size:11px;padding:2px 8px;border-radius:20px;font-weight:600}
  .f-all .count-badge{background:#B5D4F4;color:#0C447C}
  .f-pass .count-badge{background:#C0DD97;color:#27500A}
  .f-fail .count-badge{background:#F7C1C1;color:#791F1F}
  .f-pending .count-badge{background:#FAC775;color:#633806}
  .footer{text-align:center;margin-top:1.5rem;font-size:12px;color:#9CA3AF}
</style>
</head>
<body>
<div class="page">

  <div class="header">
    <div class="header-left">
      <div class="header-icon"><i class="ti ti-clipboard-check"></i></div>
      <div>
        <div class="header-title">Sales module — test execution dashboard</div>
        <div class="header-sub">Astraq AI &nbsp;·&nbsp; Certification suite &nbsp;·&nbsp; <span id="today-date"></span></div>
      </div>
    </div>
    <button class="btn-add" onclick="toggleForm()"><i class="ti ti-plus"></i> Add case</button>
  </div>

  <div class="summary">
    <div class="metric total">
      <div class="metric-top"><span class="metric-label">Total cases</span><div class="metric-icon"><i class="ti ti-list"></i></div></div>
      <div class="metric-value" id="total">0</div>
    </div>
    <div class="metric pass">
      <div class="metric-top"><span class="metric-label">Passed</span><div class="metric-icon"><i class="ti ti-circle-check"></i></div></div>
      <div class="metric-value" id="passed">0</div>
    </div>
    <div class="metric fail">
      <div class="metric-top"><span class="metric-label">Failed</span><div class="metric-icon"><i class="ti ti-circle-x"></i></div></div>
      <div class="metric-value" id="failed">0</div>
    </div>
    <div class="metric pending">
      <div class="metric-top"><span class="metric-label">Pending</span><div class="metric-icon"><i class="ti ti-clock"></i></div></div>
      <div class="metric-value" id="pending">0</div>
    </div>
    <div class="metric pct">
      <div class="metric-top"><span class="metric-label">Pass %</span><div class="metric-icon"><i class="ti ti-chart-pie"></i></div></div>
      <div class="metric-value" id="pct">0%</div>
    </div>
  </div>

  <div class="progress-wrap">
    <div class="progress-label"><span>Execution progress</span><span id="prog-label">0 / 0 executed</span></div>
    <div class="progress-bar">
      <div class="progress-pass" id="prog-pass" style="width:0%"></div>
      <div class="progress-fail" id="prog-fail" style="width:0%"></div>
      <div class="progress-pending" id="prog-pending" style="width:100%"></div>
    </div>
    <div class="legend">
      <div class="legend-item"><div class="legend-dot" style="background:#639922"></div> Pass</div>
      <div class="legend-item"><div class="legend-dot" style="background:#E24B4A"></div> Fail</div>
      <div class="legend-item"><div class="legend-dot" style="background:#BA7517"></div> Pending</div>
    </div>
  </div>

  <div class="add-form" id="addForm">
    <div class="add-form-title"><i class="ti ti-plus"></i> New test case</div>
    <div class="form-grid">
      <div class="form-group form-full"><label>Test case name</label><input type="text" id="inp-name" placeholder="e.g. Verify login functionality..." /></div>
      <div class="form-group"><label>Astraq link</label><input type="text" id="inp-url" placeholder="https://astraq.franconnectstg.net/..." /></div>
      <div class="form-group"><label>Status</label><select id="inp-status"><option value="pending">Pending</option><option value="pass">Pass</option><option value="fail">Fail</option></select></div>
    </div>
    <div class="form-btns">
      <button class="btn-save" onclick="addCase()"><i class="ti ti-check"></i> Save case</button>
      <button class="btn-cancel" onclick="toggleForm()">Cancel</button>
    </div>
  </div>

  <div class="controls">
    <button class="filter-pill f-all active-all" id="f-all" onclick="setFilter('all','active-all')"><span class="dot" style="background:#185FA5"></span> All <span class="count-badge" id="c-all">0</span></button>
    <button class="filter-pill f-pass" id="f-pass" onclick="setFilter('pass','active-pass')"><span class="dot pass"></span> Passed <span class="count-badge" id="c-pass">0</span></button>
    <button class="filter-pill f-fail" id="f-fail" onclick="setFilter('fail','active-fail')"><span class="dot fail"></span> Failed <span class="count-badge" id="c-fail">0</span></button>
    <button class="filter-pill f-pending" id="f-pending" onclick="setFilter('pending','active-pending')"><span class="dot pending"></span> Pending <span class="count-badge" id="c-pending">0</span></button>
    <div class="search-wrap"><i class="ti ti-search"></i><input class="search-input" type="text" placeholder="Search test cases..." oninput="renderTable()" id="search" /></div>
  </div>

  <div class="table-card">
    <table>
      <thead><tr><th>#</th><th>Test case name</th><th>Status</th><th>Actions</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <div class="footer">Sales Module Certification Suite &nbsp;·&nbsp; Powered by Astraq AI</div>
</div>

<script>
document.getElementById('today-date').textContent = new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});

  {id:1,name:"To validate that area/region should be added successfully",url:"https://astraq.franconnectstg.net/page-action/page/68c16d3c3ae89e3ee6cadcca/device/35f84a7cedb7814c92d0a9ba18d4cac0169",status:"pass"},

  {id:6,name:"To validate that Franchise user should be added successfully by selecting the Franchise ID",url:"https://astraq.franconnectstg.net/page-action/page/68f2288eddd3f25530f740c5/device/35f84a7cedb7814c92d0a9ba18d4cac0169",status:"pass"},

  {id:25,name:"Validate that paging moved to next page",url:"https://astraq.franconnectstg.net/page-action/page/69c41a74a1e64e951e23029c/device/35f84a7cedb7814c92d0a9ba18d4cac0169",status:"pass"},
  {id:26,name:"Create Campaign, Associate 2 Template, Associate with group, Launch campaign, create 2 workflow",url:"https://astraq.franconnectstg.net/page-action/page/68a80ad6c935c0894a5b811e/device/35f84a7cedb7814c92d0a9ba18d4cac0169",status:"pass"},
  {id:27,name:"Check WF_ExistingLead/Remove Exit condition should work for workflow",url:"https://astraq.franconnectstg.net/page-action/page/68b153193ae89e3ee6c2200b/device/35f84a7cedb7814c92d0a9ba18d4cac0169",status:"pass"},

let nextId=60,filter='all';

function toggleForm(){
  const f=document.getElementById('addForm');
  f.classList.toggle('open');
  if(f.classList.contains('open'))document.getElementById('inp-name').focus();
  else{document.getElementById('inp-name').value='';document.getElementById('inp-url').value='';document.getElementById('inp-status').value='pending';}
}

function addCase(){
  const name=document.getElementById('inp-name').value.trim();
  const url=document.getElementById('inp-url').value.trim();
  const status=document.getElementById('inp-status').value;
  if(!name){alert('Please enter a test case name.');return;}
  if(!url){alert('Please enter the Astraq link.');return;}
  cases.push({id:nextId++,name,url,status});
  toggleForm();renderTable();
}

function setFilter(f,cls){
  filter=f;
  ['f-all','f-pass','f-fail','f-pending'].forEach(id=>{
    const el=document.getElementById(id);
    el.className='filter-pill '+id;
  });
  document.getElementById('f-'+f).classList.add(cls);
  renderTable();
}

function markStatus(id,status){
  const c=cases.find(x=>x.id===id);
  if(c){c.status=status;renderTable();}
}

function deleteCase(id){
  const idx=cases.findIndex(x=>x.id===id);
  if(idx>-1){cases.splice(idx,1);renderTable();}
}

function updateSummary(){
  const total=cases.length;
  const passed=cases.filter(c=>c.status==='pass').length;
  const failed=cases.filter(c=>c.status==='fail').length;
  const pending=cases.filter(c=>c.status==='pending').length;
  const executed=passed+failed;
  const pct=total>0?Math.round((passed/total)*100):0;
  document.getElementById('total').textContent=total;
  document.getElementById('passed').textContent=passed;
  document.getElementById('failed').textContent=failed;
  document.getElementById('pending').textContent=pending;
  document.getElementById('pct').textContent=pct+'%';
  document.getElementById('prog-label').textContent=executed+' / '+total+' executed';
  document.getElementById('prog-pass').style.width=(total>0?Math.round((passed/total)*100):0)+'%';
  document.getElementById('prog-fail').style.width=(total>0?Math.round((failed/total)*100):0)+'%';
  document.getElementById('prog-pending').style.width=(total>0?Math.round((pending/total)*100):0)+'%';
  document.getElementById('c-all').textContent=total;
  document.getElementById('c-pass').textContent=passed;
  document.getElementById('c-fail').textContent=failed;
  document.getElementById('c-pending').textContent=pending;
}

function renderTable(){
  const search=document.getElementById('search').value.toLowerCase();
  const tbody=document.getElementById('tbody');
  const filtered=cases.filter(c=>(filter==='all'||c.status===filter)&&c.name.toLowerCase().includes(search));
  if(filtered.length===0){
    tbody.innerHTML=`<tr><td colspan="4"><div class="empty"><i class="ti ti-search" style="font-size:28px;display:block;margin:0 auto 10px"></i>No test cases found</div></td></tr>`;
  } else {
    let n=1;
    tbody.innerHTML=filtered.map(c=>`
      <tr class="${c.status}-row">
        <td><span class="tc-num">${n++}</span></td>
        <td><div class="tc-name">${c.name}</div></td>
        <td><span class="badge ${c.status}"><span class="dot ${c.status}"></span>${c.status==='pass'?'Pass':c.status==='fail'?'Fail':'Pending'}</span></td>
        <td><div class="actions">
          <button class="btn-play" onclick="window.open('${c.url}','_blank')"><i class="ti ti-player-play"></i> Play</button>
          <button class="btn-pass" onclick="markStatus(${c.id},'pass')" title="Mark pass"><i class="ti ti-check"></i></button>
          <button class="btn-fail" onclick="markStatus(${c.id},'fail')" title="Mark fail"><i class="ti ti-x"></i></button>
          <button class="btn-del" onclick="deleteCase(${c.id})" title="Delete"><i class="ti ti-trash"></i></button>
        </div></td>
      </tr>`).join('');
  }
  updateSummary();
}

renderTable();
</script>
